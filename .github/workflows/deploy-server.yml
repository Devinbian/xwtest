name: Deploy to XWTEST Server

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: xwtest-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_SERVER == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run typecheck:ts
          npm test

      - name: Build for production domain
        env:
          VITE_BASE_PATH: /
          SITE_ORIGIN: https://xwtest.com.cn
        run: |
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/deploy-version.txt
          tar -czf "$RUNNER_TEMP/site.tar.gz" -C dist .

      - name: Upload and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          destination="$SSH_USER@$SSH_HOST"
          release_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_dir="/home/app/xwtest-deploy/$release_id"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$destination" "umask 077; mkdir -p '$remote_dir'"
          scp "${ssh_options[@]}" -P "$SSH_PORT" "$RUNNER_TEMP/site.tar.gz" scripts/deploy/deploy-server.sh "$destination:$remote_dir/"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$destination" "bash '$remote_dir/deploy-server.sh' '$remote_dir/site.tar.gz' '$release_id' '$GITHUB_SHA'"

